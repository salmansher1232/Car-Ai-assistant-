<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Car AI Assistant</title>

<style>
body {
font-family: Arial, sans-serif;
max-width: 600px;
margin: 0 auto;
padding: 20px;
background: #f5f5f5;
}

h1 {
text-align: center;
}

.box {
background: white;
padding: 20px;
border-radius: 12px;
}

input,
button {
width: 100%;
padding: 12px;
margin-top: 10px;
box-sizing: border-box;
}

button {
font-size: 16px;
font-weight: bold;
cursor: pointer;
}

#result {
margin-top: 20px;
padding: 15px;
background: #eee;
border-radius: 8px;
}
</style>
</head>

<body>

<div class="box">
<h1>🚗 Car AI Assistant</h1>

<label>Car Photo / Auction Sheet:</label>
<input type="file" id="carImage" accept="image/*">

<label>Car Model:</label>
<input type="text" id="carModel" placeholder="Example: Toyota Prius">

<label>Auction Price (¥):</label>
<input type="number" id="auctionPrice" placeholder="Example: 500000">

<label>Expected Repair Cost (¥):</label>
<input type="number" id="repairCost" placeholder="Example: 100000">

<label>Expected Selling Price (¥):</label>
<input type="number" id="sellingPrice" placeholder="Example: 800000">

<button onclick="analyzeCar()">ANALYZE CAR</button>

<div id="result">
Result will appear here.
</div>
</div>

<script>
function analyzeCar() {
const model = document.getElementById("carModel").value;
const auction = Number(document.getElementById("auctionPrice").value);
const repair = Number(document.getElementById("repairCost").value);
const selling = Number(document.getElementById("sellingPrice").value);

const totalCost = auction + repair;
const profit = selling - totalCost;

let decision = "SKIP ❌";

if (profit > 0) {
decision = "BUY / CONSIDER ✅";
}

document.getElementById("result").innerHTML = `
<h2>${decision}</h2>
<p><strong>Car:</strong> ${model || "Not entered"}</p>
<p><strong>Total Cost:</strong> ¥${totalCost.toLocaleString()}</p>
<p><strong>Expected Sale:</strong> ¥${selling.toLocaleString()}</p>
<p><strong>Estimated Profit:</strong> ¥${profit.toLocaleString()}</p>
`;
}
</script>

</body>
</html>
